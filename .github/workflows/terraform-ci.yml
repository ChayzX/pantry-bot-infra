name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [oracle-primary, gcp-standby]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt check
        run: terraform fmt -check -recursive ../..

      # No backend/credentials in CI for PRs from forks or untrusted branches
      # — validate syntax only, don't touch real state or cloud accounts.
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate
