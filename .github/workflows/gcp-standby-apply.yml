name: GCP standby - apply (INACTIVE BY DESIGN, do not run without asking)

# STATUS: INACTIVE BY DESIGN — see terraform/gcp-standby/STATUS.md.
# GCP was deliberately dropped from the active failover set (home + Oracle
# only, confirmed with the user) once Oracle became the target primary. This
# workflow is left in place, manual-only, on purpose — not because it was
# missed. Do not run it "to catch things up" without the user explicitly
# asking for GCP to rejoin the active failover set.
#
# Unlike the Oracle stack, GCP Always-Free e2-micro capacity isn't contested,
# so this doesn't need a retry loop — it's a plain manual apply. Keeping it
# separate from the Oracle workflow also means a GCP config change never
# triggers an unrelated Oracle retry run or vice versa.

on:
  workflow_dispatch: {}

concurrency:
  group: gcp-standby-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp-standby
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The default wrapper this action installs always exits 0
          # regardless of terraform's real exit code, which would make a
          # genuine apply failure misreport as a green step.
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_R2_BUCKET }}" \
            -backend-config="endpoint=${{ secrets.TF_STATE_R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}" \
            -backend-config="region=auto"

      - name: terraform apply
        env:
          TF_VAR_gcp_project_id:                ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_credentials_json:           ${{ secrets.GCP_CREDENTIALS_JSON }}
          TF_VAR_ssh_public_key:                 ${{ secrets.PANTRY_BOT_SSH_PUBLIC_KEY_GCP }}
          TF_VAR_cloudflare_tunnel_token:        ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          TF_VAR_litestream_access_key_id:       ${{ secrets.LITESTREAM_R2_ACCESS_KEY_ID }}
          TF_VAR_litestream_secret_access_key:   ${{ secrets.LITESTREAM_R2_SECRET_ACCESS_KEY }}
        run: terraform apply -auto-approve -input=false
